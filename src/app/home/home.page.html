<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Login
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-item>
    <ion-icon slot="start" name="people" size="large"></ion-icon>
  </ion-item>
  
  <ion-list>
    
   <ion-item>
      <ion-input labelPlacement="floating" label="Email " type="email" placeholder="email@domain.com"></ion-input>
    </ion-item>

     <ion-item>
      <ion-input labelPlacement="floating" label="Password " type="password" ></ion-input>
    </ion-item>

    <ion-button >Ingresar</ion-button>
    <ion-button>Registrar</ion-button>
</ion-list>

</ion-content>
